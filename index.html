<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salvar e Visualizar Texto</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
        input { width: 70%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
        ul { margin-top: 20px; padding-left: 0; list-style-type: none; }
        li { padding: 10px; border-bottom: 1px solid #eee; background-color: #f9f9f9; margin-bottom: 5px; border-radius: 4px; font-size: 16px; }
    </style>
</head>
<body>

    <h2>Salvar Texto no Banco de Dados</h2>
    
    <input type="text" id="meuInput" placeholder="Digite algo aqui...">
    <button id="btnEnviar">Enviar</button>

    <h3>Textos Salvos:</h3>
    <ul id="listaTextos"></ul>

    <!-- Scripts Atualizados para Compatibilidade Global -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, push, onValue } from "https://gstatic.com";

        const firebaseConfig = {
            apiKey: "AIzaSyBOiY5IW487iEXxubv4068",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://transcricao-ingles-default-rtdb.firebaseio.com",
            projectId: "transcricao-ingles",
            storageBucket: "://appspot.com",
            messagingSenderId: "1059422828935",
            appId: "1:1059422828935:web:410bcb73",
            measurementId: "G-LRZT09B73F"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const bancoRef = ref(database, 'textos');

        const input = document.getElementById('meuInput');
        const botao = document.getElementById('btnEnviar');
        const lista = document.getElementById('listaTextos');

        botao.addEventListener('click', () => {
            const texto = input.value.trim();
            
            if (texto !== "") {
                push(bancoRef, {
                    conteudo: texto,
                    timestamp: Date.now()
                })
                .then(() => {
                    input.value = ""; 
                })
                .catch((erro) => {
                    alert("Erro ao salvar! Verifique as regras do Firebase.");
                    console.error(erro);
                });
            }
        });

        onValue(bancoRef, (snapshot) => {
            lista.innerHTML = ""; 
            
            if (snapshot.exists()) {
                const dados = snapshot.val();
                
                Object.values(dados).forEach(item => {
                    const li = document.createElement('li');
                    li.textContent = item.conteudo;
                    lista.appendChild(li);
                });
            } else {
                lista.innerHTML = "<li>Nenhum texto salvo ainda.</li>";
            }
        });
    </script>
</body>
</html>
