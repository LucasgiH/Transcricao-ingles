<!DOCTYPE html>
<!-- sistema baseado primeira versao transcrisao para salvar temas estudo -->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salvar e Visualizar com Planilha</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
        .label-data { display: block; margin-bottom: 15px; font-weight: bold; color: #555; font-size: 15px; }
        input { width: 65%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
        ul { margin-top: 20px; padding-left: 0; list-style-type: none; }
        li { padding: 10px; border-bottom: 1px solid #eee; background-color: #f9f9f9; margin-bottom: 5px; border-radius: 4px; font-size: 16px; }
    </style>
</head>
<body>

    <h2>Salvar Texto no Banco de Dados (Planilha)</h2>
    <label id="labelDataAtual" class="label-data"></label>
    
    <input type="text" id="meuInput" placeholder="Digite algo aqui...">
    <button id="btnEnviar">Enviar</button>

    <h3>Textos Salvos:</h3>
    <ul id="listaTextos"></ul>

    <script>
        // Link de envio do Formulário
        const URL_FORMULARIO = "https://docs.google.com/forms/d/e/1FAIpQLSc2Ss9rLVimE5sBlMu_oDsoM4yW0frAusOtZQxIDa-Us3eKFw/formResponse";
        const ID_CAMPO_TEXTO = "entry.730854788"; 

        // Link de LEITURA da Planilha (Convertido para formato aberto TSV)
        const URL_LEITURA_PLANILHA = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRYukjKYJc15KobhiHyW7xdE70ZoCAqgC2XykcyiRYtkBoRzWxKpIG612ljXAkcGny7ImtGjjTvYkuD/pub?output=tsv";

        const input = document.getElementById('meuInput');
        const botao = document.getElementById('btnEnviar');
        const lista = document.getElementById('listaTextos');
        const labelDataAtual = document.getElementById('labelDataAtual');

        // Retorna a data atual no formato DD/MM/AAAA
        function obterDataHojeFormatada() {
            const hoje = new Date();
            const dia = String(hoje.getDate()).padStart(2, '0');
            const mes = String(hoje.getMonth() + 1).padStart(2, '0');
            const ano = hoje.getFullYear();
            return `${dia}/${mes}/${ano}`;
        }

        // Normaliza a data vinda da planilha para DD/MM/AAAA (suporta DD/MM/AAAA e AAAA-MM-DD)
        function extrairDataRegistro(carimboDataHora) {
            if (!carimboDataHora) return "";
            const apenasData = carimboDataHora.trim().split(" ")[0];

            // Formato padrão Google Forms PT-BR: DD/MM/AAAA (ou D/M/AAAA)
            if (apenasData.includes("/")) {
                const partes = apenasData.split("/");
                if (partes.length === 3) {
                    const dia = partes[0].padStart(2, '0');
                    const mes = partes[1].padStart(2, '0');
                    const ano = partes[2];
                    return `${dia}/${mes}/${ano}`;
                }
            }

            // Formato ISO: AAAA-MM-DD
            if (apenasData.includes("-")) {
                const partes = apenasData.split("-");
                if (partes.length === 3) {
                    return `${partes[2].padStart(2, '0')}/${partes[1].padStart(2, '0')}/${partes[0]}`;
                }
            }

            return apenasData;
        }

        // Inicializa a label com o dia atual e carrega os dados
        window.onload = () => {
            labelDataAtual.textContent = "Data atual: " + obterDataHojeFormatada();
            carregarDados();
        };

        // Função para ENVIAR o texto
        botao.addEventListener('click', () => {
            const texto = input.value.trim();
            if (texto !== "") {
                botao.innerText = "Enviando...";
                botao.disabled = true;

                const dados = new FormData();
                dados.append(ID_CAMPO_TEXTO, texto);

                fetch(URL_FORMULARIO, {
                    method: "POST",
                    mode: "no-cors",
                    body: dados
                })
                .then(() => {
                    input.value = ""; 
                    botao.innerText = "Enviar";
                    botao.disabled = false;
                    // Recarrega a lista na tela logo após enviar
                    setTimeout(carregarDados, 1000); 
                })
                .catch(erro => {
                    alert("Erro ao enviar.");
                    botao.innerText = "Enviar";
                    botao.disabled = false;
                });
            }
        });

        // Função para LER os dados da Planilha e exibir apenas os do dia atual
        function carregarDados() {
            const dataHoje = obterDataHojeFormatada();
            labelDataAtual.textContent = "Data atual: " + dataHoje;

            fetch(URL_LEITURA_PLANILHA + "&cachebust=" + Date.now())
            .then(res => res.text())
            .then(textotsv => {
                lista.innerHTML = "";
                
                const linhas = textotsv.split(/\r?\n/);
                
                // Começa do 1 para pular os títulos da planilha ("Carimbo de data/hora" e "Texto")
                for (let i = 1; i < linhas.length; i++) {
                    if (linhas[i].trim() === "") continue;
                    
                    const colunas = linhas[i].split("\t");
                    const dataLinha = extrairDataRegistro(colunas[0]);
                    
                    // Verifica se a data da linha é igual à data atual e se há texto na segunda coluna
                    if (dataLinha === dataHoje && colunas[1] && colunas[1].trim() !== "") {
                        const li = document.createElement('li');
                        li.textContent = colunas[1].trim();
                        lista.insertBefore(li, lista.firstChild); // Coloca o mais recente no topo
                    }
                }
                // Se nenhum dado for do dia atual, a lista permanece vazia (não aparece nada)
            })
            .catch(err => {
                lista.innerHTML = "";
                console.error(err);
            });
        }
    </script>
</body>
</html>
