<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salvar e Visualizar Texto</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
        input { width: 65%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
        ul { margin-top: 20px; padding-left: 0; list-style-type: none; }
        li { padding: 10px; border-bottom: 1px solid #eee; background-color: #f9f9f9; margin-bottom: 5px; border-radius: 4px; font-size: 16px; }
    </style>
    <!-- Carrega a biblioteca do Firebase de forma direta e global -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
</head>
<body>

    <h2>Salvar Texto no Banco de Dados</h2>
    
    <input type="text" id="meuInput" placeholder="Digite algo aqui...">
    <button id="btnEnviar">Enviar</button>

    <h3>Textos Salvos:</h3>
    <ul id="listaTextos"></ul>

    <script>
        // Suas credenciais do Firebase obtidas anteriormente
        const firebaseConfig = {
            apiKey: "AIzaSyBOiY5IW487iEXxubv4068",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebaseio.com",
            projectId: "transcricao-ingles",
            storageBucket: "://appspot.com",
            messagingSenderId: "1059422828935",
            appId: "1:1059422828935:web:410bcb73",
            measurementId: "G-LRZT09B73F"
        };

        // Inicializa o Firebase globalmente
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const bancoRef = database.ref('textos');

        const input = document.getElementById('meuInput');
        const botao = document.getElementById('btnEnviar');
        const lista = document.getElementById('listaTextos');

        // Enviar dados para o banco
        botao.addEventListener('click', () => {
            const texto = input.value.trim();
            
            if (texto !== "") {
                bancoRef.push({
                    conteudo: texto,
                    timestamp: Date.now()
                })
                .then(() => {
                    input.value = ""; // Limpa o input se der certo
                })
                .catch((erro) => {
                    alert("Erro de permissão no Firebase. Verifique as regras!");
                    console.error(erro);
                });
            }
        });

        // Ouvir o banco em tempo real e mostrar na tela
        bancoRef.on('value', (snapshot) => {
            lista.innerHTML = ""; 
            if (snapshot.exists()) {
                const dados = snapshot.val();
                Object.values(dados).forEach(item => {
                    const li = document.createElement('li');
                    li.textContent = item.conteudo;
                    lista.appendChild(li);
                });
            } else {
                lista.innerHTML = "<li>Nenhum texto salvo ainda.</li>";
            }
        });
    </script>
</body>
</html>
