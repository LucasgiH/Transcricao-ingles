<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Caixinhas de Palavras</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
        }

        input {
            width: 65%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }

        button:hover {
            background-color: #0056b3;
        }

        #containerTextoMestre {
            font-size: 20px;
            line-height: 2;
            margin-bottom: 20px;
            text-align: center;
        }

        .palavra-oculta,
        .palavra-revelada {
            display: inline-block;
            border-radius: 4px;
            padding: 2px 8px;
            margin: 2px;
            cursor: pointer;
        }

        .palavra-oculta {
            background-color: #ddd;
            color: transparent;
            user-select: none;
        }

        .palavra-revelada {
            background-color: #e2f0d9;
            color: #385723;
            font-weight: bold;
        }

        .azul {
            background-color: #007bff !important;
            color: white !important;
        }

        .erro {
            color: red;
            font-size: 14px;
            margin-top: 10px;
            min-height: 20px;
        }

        li {
            padding: 8px;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>

<body>

    <h2>Descubra as palavras</h2>

    <h3>Texto mestre:</h3>

    <div id="containerTextoMestre"></div>

    <input
        type="text"
        id="meuInput"
        placeholder="Digite uma ou mais palavras..."
    >

    <button id="btnEnviar">Enviar</button>

    <div id="mensagemErro" class="erro"></div>

    <h3>Palavras descobertas:</h3>

    <ul id="listaPalavras"></ul>

    <script>
        // 1. TEXTO DEFINIDO PELO PROGRAMADOR

        //const TEXTO_MESTRE = "maybe you could help great so go and collect all the dirty laundry exactly that's why i got this research what i mean hopkins is that i am glad to report";
        let TEXTO_MESTRE = "";
        let palavrasMestre = [];
        let linhasMestre = [];
        
        // 2. NOMES DOS ARQUIVOS DE ÁUDIO

        const arquivosDeAudio = [
            "Maybe-you-could-help.mp4",
            "i-don't-suppose-you-could-use-a-native-of-sweden.mp4",
        ];

        // 3. ELEMENTOS DA PÁGINA

        const containerMestre =
            document.getElementById("containerTextoMestre");

        const input =
            document.getElementById("meuInput");

        const botao =
            document.getElementById("btnEnviar");

        const mensagemErro =
            document.getElementById("mensagemErro");

        const listaPalavras =
            document.getElementById("listaPalavras");


        // 4. PALAVRAS DESCOBERTAS

        let palavrasDescobertas = [];

        // 6. FUNÇÃO PARA NORMALIZAR AS PALAVRAS

        function limparPalavra(palavra) {
            return palavra
                .toLowerCase()
                .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");
        }
       /*
        const audios = arquivosDeAudio.map(arquivo => {

            const nome = arquivo.replace(".mp4", "");
        
            const palavras = nome
                .split("-")
                .map(palavra => limparPalavra(palavra));
        
            return {
                arquivo: arquivo,
                palavras: palavras,
                audio: new Audio(arquivo)
            };
        });*/
        
        const audios = arquivosDeAudio.map(arquivo => {
        
            const nome = arquivo.replace(".mp4", "");
        
            const palavras = nome
                .split("-")
                .map(palavra => limparPalavra(palavra));
        
            return {
                arquivo: arquivo,
                palavras: palavras,
                audio: new Audio(arquivo),
                indices: []
            };
        });

        // 7. DIVIDIR O TEXTO MESTRE EM PALAVRAS

        //const palavrasMestre = TEXTO_MESTRE.split(/\s+/);
        function carregarTextoMestre() {
            fetch("texto.txt")
                .then(resposta => {
                    if (!resposta.ok) {
                        throw new Error("Não foi possível carregar texto.txt");
                    }
        
                    return resposta.text();
                })
                .then(texto => {
        
                    TEXTO_MESTRE = texto;
        
                    // Separar o texto por linhas.
                    linhasMestre = TEXTO_MESTRE
                        .split(/\r?\n/)
                        .filter(linha => linha.trim() !== "");
        
                    palavrasMestre = [];

                    linhasMestre.forEach(linha => {
                        const palavrasDaLinha = linha.split(/\s+/);
                    
                        palavrasDaLinha.forEach(palavra => {
                            palavrasMestre.push(palavra);
                        });
                    });
                    
                    // Descobrir as posições de cada áudio.
                    audios.forEach(audio => {
                    
                        audio.indices = [];
                    
                        palavrasMestre.forEach((palavra, indice) => {
                    
                            const palavraLimpa = limparPalavra(palavra);
                    
                            if (audio.palavras.includes(palavraLimpa)) {
                                audio.indices.push(indice);
                            }
                    
                        });
                    
                    });

                    // Exibir as caixinhas.
                    renderizarTextoMestre();
        
                })
                .catch(erro => {
                    console.error(erro);
        
                    mensagemErro.textContent =
                        "Não foi possível carregar o arquivo texto.txt.";
                });
        }


        // 8. EXIBIR AS CAIXINHAS

        function renderizarTextoMestre() {
            containerMestre.innerHTML = "";
        
            let indice = 0;
        
            linhasMestre.forEach(linha => {
        
                const palavrasDaLinha = linha.split(/\s+/);
        
                palavrasDaLinha.forEach(palavra => {
        
                    const palavraLimpa = limparPalavra(palavra);
        
                    const caixa = document.createElement("span");
        
                    caixa.dataset.indice = indice;
        
                    if (palavrasDescobertas.includes(palavraLimpa)) {
        
                        caixa.textContent = palavra;
                        caixa.className = "palavra-revelada";
        
                    } else {
        
                        caixa.textContent = "•".repeat(palavra.length);
                        caixa.className = "palavra-oculta";
        
                    }
        
                    const indiceAtual = indice;
                    
                    caixa.addEventListener("click", function() {
                        clicarCaixinha(indiceAtual);
                    });
        
                    containerMestre.appendChild(caixa);
        
                    containerMestre.appendChild(
                        document.createTextNode(" ")
                    );
        
                    indice++;
        
                });
        
                // Começar a próxima fala em uma nova linha.
                containerMestre.appendChild(
                    document.createElement("br")
                );
        
            });
        }

        // 9. O QUE ACONTECE QUANDO UMA CAIXINHA É CLICADA

            // Procurar se a caixinha pertence a algum grupo de áudio.

        function clicarCaixinha(indiceClicado) {
        
            // Procurar o áudio que contém a palavra clicada.
            const audioSelecionado = audios.find(audio =>
                audio.indices.includes(indiceClicado)
            );
        
            // Se não houver áudio associado, não fazer nada.
            if (!audioSelecionado) {
                return;
            }
        
            // Remover o azul de todas as caixinhas.
            const todasAsCaixinhas =
                containerMestre.querySelectorAll("span");
        
            todasAsCaixinhas.forEach(caixa => {
                caixa.classList.remove("azul");
            });
        
            // Pintar de azul todas as caixinhas associadas ao áudio.
            audioSelecionado.indices.forEach(indice => {
        
                const caixa = containerMestre.querySelector(
                    `[data-indice="${indice}"]`
                );
        
                if (caixa) {
                    caixa.classList.add("azul");
                }
        
            });
        
            // Reproduzir o áudio selecionado.
            audioSelecionado.audio.currentTime = 0;
        
            audioSelecionado.audio.play().catch(erro => {
                console.error(
                    "Não foi possível reproduzir o áudio:",
                    erro
                );
            });
        }

        // 10. VALIDAR AS PALAVRAS DIGITADAS

        botao.addEventListener("click", function() {

            mensagemErro.textContent = "";

            const entrada = input.value.trim().toLowerCase();

            if (entrada === "") {
                return;
            }

            const palavrasDigitadas = entrada.split(/\s+/);

            const palavrasValidadas = [];

            for (let palavra of palavrasDigitadas) {

                palavra = limparPalavra(palavra);

                if (palavra === "") {
                    continue;
                }

                // Verificar se a palavra existe no texto mestre.

                const existe = palavrasMestre.some(p =>
                    limparPalavra(p) === palavra
                );

                if (!existe) {
                    mensagemErro.textContent =
                        "A palavra '" + palavra +
                        "' não existe no texto mestre.";

                    input.value = "";
                    return;
                }

                // Verificar se a palavra já foi descoberta.

                if (
                    palavrasDescobertas.includes(palavra) ||
                    palavrasValidadas.includes(palavra)
                ) {
                    mensagemErro.textContent =
                        "A palavra '" + palavra +
                        "' já foi usada anteriormente.";

                    input.value = "";
                    return;
                }

                palavrasValidadas.push(palavra);
            }

            if (palavrasValidadas.length === 0) {
                return;
            }

            // Registrar as palavras descobertas.

            palavrasValidadas.forEach(palavra => {

                palavrasDescobertas.push(palavra);

                const item = document.createElement("li");

                item.textContent = palavra;

                listaPalavras.appendChild(item);
            });

            // Atualizar as caixinhas.

            renderizarTextoMestre();

            // Limpar o campo.

            input.value = "";
        });


        // 11. INICIAR O PROGRAMA

        //renderizarTextoMestre();
        carregarTextoMestre();

    </script>

</body>
</html>
