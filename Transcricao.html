<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salvar Texto na Planilha</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
        input { width: 65%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #28a745; color: white; border: none; border-radius: 4px; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

    <h2>Salvar Texto na Planilha</h2>
    
    <input type="text" id="meuInput" placeholder="Digite algo aqui...">
    <button id="btnEnviar">Enviar</button>

    <script>
        // ⚠️ SUBSTITUA COM O LINK DO SEU FORMULÁRIO (Mantenha o /formResponse no final!)
        //const URL_FORMULARIO = "";
        const URL_FORMULARIO = "https://docs.google.com/forms/d/e/1FAIpQLSc2Ss9rLVimE5sBlMu_oDsoM4yW0frAusOtZQxIDa-Us3eKFw/formResponse";
        
        
        // ⚠️ SUBSTITUA COM O NÚMERO DA SUA ENTRY DO GOOGLE
        //const ID_CAMPO_TEXTO = "entry.123456789"; 
        const ID_CAMPO_TEXTO = "entry.730854788";
        
        const input = document.getElementById('meuInput');
        const botao = document.getElementById('btnEnviar');

        botao.addEventListener('click', () => {
            const texto = input.value.trim();
            if (texto !== "") {
                botao.innerText = "Enviando...";
                botao.disabled = true;

                const dados = new FormData();
                dados.append(ID_CAMPO_TEXTO, texto);

                // Envia direto para a planilha do Google de forma invisível
                fetch(URL_FORMULARIO, {
                    method: "POST",
                    mode: "no-cors",
                    body: dados
                })
                .then(() => {
                    input.value = ""; // Limpa a tela
                    botao.innerText = "Enviar";
                    botao.disabled = false;
                    alert("Enviado com sucesso! Olhe sua planilha.");
                })
                .catch(erro => {
                    alert("Erro ao conectar.");
                    botao.innerText = "Enviar";
                    botao.disabled = false;
                });
            }
        });
    </script>
</body>
</html>
